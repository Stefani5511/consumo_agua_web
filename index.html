<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consumo de Água</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section id="splash" class="tela splash">
        <div class="splash-conteudo">
            <img src="assets/icone.png" alt="Ícone de consumo de água" class="icone">

            <label class="controle-tema">
                <span>Tema escuro</span>
                <input type="checkbox" id="temaEscuro">
                <span class="slider"></span>
            </label>

            <button type="button" class="btn-principal" id="btnEntrar">Entrar</button>
        </div>
    </section>

    <section id="home" class="tela home escondido">
        <header class="cabecalho">
            <button type="button" class="btn-voltar" id="btnVoltar">←</button>
            <h1>Bebi água</h1>
            <button type="button" class="btn-adicionar" id="btnAdicionar">+</button>
        </header>

        <main class="conteudo">
            <section class="resumo">
                <h2>Consumo de hoje</h2>
                <p id="totalHoje">0 ml</p>
                <span id="porcentagemMeta">0.0% da meta diária</span>
            </section>

            <section id="listaConsumos" class="lista-consumos"></section>
        </main>
    </section>

    <div id="modalCadastro" class="modal escondido">
        <div class="modal-conteudo">
            <button type="button" class="btn-fechar" id="btnFecharCadastro">×</button>

            <h2 id="tituloModal">Novo consumo</h2>

            <form id="formConsumo">
                <div class="campo">
                    <label for="quantidade">Quantidade em ml</label>
                    <input type="number" id="quantidade" min="0" step="0.1" required>
                </div>

                <div class="campo">
                    <label for="peso">Peso atual em kg</label>
                    <input type="number" id="peso" min="0" step="0.1" required>
                </div>

                <button type="submit" class="btn-principal" id="btnSalvar">Cadastrar</button>
            </form>
        </div>
    </div>

    <div id="modalExcluir" class="modal escondido">
        <div class="modal-conteudo modal-confirmacao">
            <h2>Excluir registro</h2>
            <p>Confirma a exclusão deste registro?</p>

            <div class="acoes-modal">
                <button type="button" class="btn-secundario" id="btnCancelarExclusao">Cancelar</button>
                <button type="button" class="btn-excluir" id="btnConfirmarExclusao">Ok</button>
            </div>
        </div>
    </div> 

    <script src="script.js"></script>
</body>
</html>
